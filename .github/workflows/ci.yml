name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # a leaked handle used to make this job sit at "in progress" for as long as
    # GitHub allows. A timeout turns a hang into a failure someone can read.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No dependencies to install. That is the point (ADR-0003).
      - name: Link workspaces
        run: npm install --no-audit --no-fund

      - name: Tests — unit, integration, invariants, security, dashboard
        env:
          # a quiet runner can afford two files at a time; a busy machine cannot
          SUI_TEST_CONCURRENCY: '2'
        run: npm test

      - name: Eval harness self-test (graders grade what they claim)
        run: npm run eval:self

      - name: Config examples are valid
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/sui.config.json','utf8'));JSON.parse(require('fs').readFileSync('config/sui.schema.json','utf8'));console.log('ok')"
          node -e "const {normalizeConfig}=require('@drsamonline/core');" 2>/dev/null || true

      - name: Invariant audit
        run: node apps/cli/bin/sui.js invariants --config config/sui.config.json

      - name: Vendored kits load
        run: node apps/cli/bin/sui.js kits

      - name: WCAG AA on every token pair (I9)
        run: node apps/cli/bin/sui.js tokens --check

      - name: Catalogue builds from app-endpoints
        run: node scripts/build-catalog.mjs

      # 29 catalogue endpoints exist now, and CI has no egress: a probe here is
      # proving that a failed probe is reported, not that a provider works. A
      # short timeout keeps the job at seconds instead of minutes.
      - name: Prober reports honestly when nothing answers
        run: |
          set -euo pipefail
          out=$(node apps/cli/bin/sui.js probe --json --timeout 300)
          echo "$out" | head -20
          echo "$out" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);if(!j.results.length)process.exit(1);const bad=j.results.filter(r=>!r.ok&&!r.reasons.length);if(bad.length){console.error('a failed probe must say why:',bad.map(b=>b.provider));process.exit(1)}console.log('every failed probe named a reason')})"

      - name: Project audit — invariants, docs, dead code, secrets
        run: node scripts/audit.mjs

      - name: ADR compliance — the code still honours every decision
        run: node scripts/adr-check.mjs

      - name: ADR-0001 gates — p95 at 200 rps, ledger size, no build step
        run: node scripts/adr-gate.mjs

  dashboard:
    # The only job that looks at what a user actually sees. A screenshot cannot
    # tell you the page is broken; this fails on a console error.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Install a browser for the smoke test
        run: npx --yes puppeteer@23 browsers install chrome
      - name: Dashboard renders in three states, with no console errors
        env:
          PUPPETEER_PATH: ${{ github.workspace }}/node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund puppeteer-core@23
          CHROME_PATH=$(node -e "const p=require('puppeteer');console.log(p.executablePath())" 2>/dev/null || true)
          if [ -z "$CHROME_PATH" ]; then
            CHROME_PATH=$(find "$HOME/.cache/puppeteer" -name chrome -type f | head -1)
          fi
          echo "chrome: $CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node scripts/smoke-dashboard.mjs
          CHROME_PATH="$CHROME_PATH" node scripts/smoke-dashboard.mjs --empty
          CHROME_PATH="$CHROME_PATH" node scripts/smoke-dashboard.mjs --degraded

  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Data-plane overhead against the 15ms budget (I2)
        run: node scripts/soak.mjs --minutes 1 --rps 20 --report soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-report
          path: soak.json

  eval:
    timeout-minutes: 20
    # A free-tier eval with no free tier is theatre, so this job is skipped when
    # no key is configured. The check has to live on the step, not the job:
    # GitHub does not expose the `secrets` context to a job-level `if`, and using
    # it there makes the whole workflow invalid — which is why this file produced
    # zero jobs for four days.
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Onboarding, then a real round-trip
        if: env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != ''
        run: |
          set -euo pipefail
          tmp=$(mktemp -d); cd "$tmp"
          SUI_HOME="$tmp/.sui" node "$GITHUB_WORKSPACE/apps/cli/bin/sui.js" init --no-serve | tee out.txt
          grep -q "Endpoint ready" out.txt
      - name: Golden-set eval — blocks the merge on regression (I10)
        if: env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != ''
        run: node evals/run.mjs --config config/sui.config.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/report-*

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Migration preview runs against the example config
        run: |
          set -euo pipefail
          tmp=$(mktemp -d); cd "$tmp"
          SUI_HOME="$tmp/.sui" node "$GITHUB_WORKSPACE/apps/cli/bin/sui.js" init --no-serve > /dev/null
          node "$GITHUB_WORKSPACE/apps/cli/bin/sui.js" migrate "$GITHUB_WORKSPACE/config/examples/old-router.config.json" | tee mig.txt
          grep -q "looks like 9router" mig.txt
          grep -q "Nothing written" mig.txt
