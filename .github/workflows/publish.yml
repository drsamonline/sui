name: publish

# Publishing is permanent: a version cannot be reused and a bad tarball cannot be
# withdrawn. So it happens on a tag, on a runner, from a secret this repository
# never stores — not from someone's laptop with their token in the shell history.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: check everything, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance: the tarball carries a signed statement of what built it

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # No dependencies to install; this only links the workspace packages.
      - name: Link workspaces
        run: npm install --no-audit --no-fund

      # A tag that disagrees with package.json would publish one version and label
      # it another. Refuse before anything irreversible happens.
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag: $tag · package.json: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # Never publish something that has not passed the gates in this repository.
      - name: Tests
        run: npm test

      - name: Audit and ADR compliance
        run: npm run audit

      - name: Eval harness self-test
        run: npm run eval:self

      - name: Everything the publisher refuses to publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish.mjs --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: node scripts/publish.mjs --real

      - name: Keep the tarballs as evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/tarballs
          for d in packages/* apps/*; do
            [ -f "$d/package.json" ] || continue
            (cd "$d" && npm pack --pack-destination /tmp/tarballs >/dev/null 2>&1) || true
          done
          ls -la /tmp/tarballs | head -25

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-tarballs
          path: /tmp/tarballs
          if-no-files-found: warn
